[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huggingfacehub"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=1.20",
    "hf-xet",
]

[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
packages = ["hfhub", "hfhub.views"]

[project.scripts]
hfu = "hfhub.cli:hfu_main"
hf-xfer = "hfhub.cli:xfer_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
